# cargo-mutants (https://mutants.rs): which code to mutate and how to test it.
# Used by .github/workflows/mutants.yml (advisory: nothing here blocks a merge).
# Run by hand: cargo mutants -p quire-markdown --in-diff <(git diff main...)

# Test code and generated or hostile-input fixtures are not logic to mutate.
exclude_globs = ["**/tests/**", "**/tests.rs", "**/testdata/**", "**/hostile.rs"]

# A changed Debug or Display text is not a behaviour. (The mutant's name reads
# "replace <impl Display for Foo>::fmt -> Result with Ok(Default::default())".)
exclude_re = [
    "impl (Debug|Display) for",
    # A `\n` and the `]` of `]]` are never the same byte (see the comment in `wikilink_at`).
    "replace < with <= in Cursor<'a>::wikilink_at",
    # Looking the index up again when the last range ends exactly at `from` reaches the same index as the loop after it.
    "replace > with >= in Overlap<'a>::hits",
]

# A mutant that loops forever is stopped after 3 x the unmutated test time
# (at least a minute), and counts as caught.
timeout_multiplier = 3
minimum_test_timeout = 60

# Not the doctests (slow, and they check examples, not logic). `deep_yaml`
# tests only check stack depth and take long under a mutant.
additional_cargo_test_args = ["--tests", "--", "--skip", "deep_yaml"]

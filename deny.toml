# cargo-deny: keeps dependencies AGPL-compatible, free of known
# vulnerabilities, and from crates.io only. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  # zvariant/zbus_names were merged into zbus 6 (not abandoned, no vulnerability).
  # They come from eframe -> accesskit (Linux screen-reader bridge); this clears
  # when accesskit moves to zbus 6. Dependabot will raise that upgrade.
  { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; transitive via accesskit" },
  { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; transitive via accesskit" },
  { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; transitive via accesskit" },
  # quire-typeset: pinned by Typst 0.15 / MiTeX 0.2 / mermaid-rs-renderer 0.3.
  # Checked 2026-11-15: typst 0.15.1, hayagriva 0.10.1, citationberg 0.7.0 and
  # mitex 0.2.4 are the newest releases, so no parent upgrade removes these.
  # quick-xml 0.38 (DoS) is reached only through citationberg's CSL parser. Quire
  # sends Typst a style *name* from a fixed list (BIB_STYLES in
  # quire-typeset/src/markdown.rs: embedded APA, Chicago author-date, IEEE),
  # never a CSL file, and user BibTeX goes to biblatex, not to an XML parser.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via typst -> hayagriva -> citationberg; only embedded CSL styles are parsed (no user CSL), design 0.9 G.3" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via typst -> hayagriva -> citationberg; only embedded CSL styles are parsed (no user CSL), design 0.9 G.3" },
  # rkyv 0.7 comes from mitex-spec, whose `from_bytes` (the only reader of
  # untrusted-looking archives) is never called by mitex, mitex-parser or
  # mitex-lexer; the crate's rkyv features are on by default and its parents
  # offer no way to turn them off.
  { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7 via mitex-spec; its archive reader is never called, nothing user-supplied is deserialized" },
  # Unmaintained, no vulnerability.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1 unmaintained; via typst -> syntect" },
  { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; via mitex" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; via typst -> hayagriva -> biblatex" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; via typst-layout and krilla" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; via typst, fontdb and mermaid-rs-renderer" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; via typst -> hayagriva -> serde_yaml (hayagriva YAML bibliographies are not offered; Quire reads BibTeX and CSL JSON with its own code)" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained; via typst -> syntect -> two-face (syntax definitions embedded at build time, no user YAML)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Everything here is compatible with distributing Quire under AGPL-3.0-or-later.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

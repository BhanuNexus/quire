# cargo-deny: keeps dependencies AGPL-compatible, free of known
# vulnerabilities, and from crates.io only. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
  # zvariant/zbus_names were merged into zbus 6 (not abandoned, no vulnerability).
  # They come from eframe -> accesskit (Linux screen-reader bridge); this clears
  # when accesskit moves to zbus 6. Dependabot will raise that upgrade.
  { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; transitive via accesskit" },
  { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; transitive via accesskit" },
  { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; transitive via accesskit" },
  # quire-typeset: pinned by Typst 0.15 / MiTeX 0.2 / mermaid-rs-renderer 0.3,
  # no compatible upgrade exists. Revisit when those crates update.
  # quick-xml 0.38 (DoS) is only used by citationberg to parse CSL bibliography
  # styles. Quire only ever parses the styles embedded at build time (APA,
  # Chicago author-date, IEEE; design 0.9 §G.3) and never user-supplied CSL.
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38 via typst -> hayagriva -> citationberg; CSL parsing only of styles embedded at build time (APA/Chicago/IEEE)" },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38 via typst -> hayagriva -> citationberg; CSL parsing only of styles embedded at build time (APA/Chicago/IEEE)" },
  # rkyv 0.7 only deserializes MiTeX's own command table, embedded at build time.
  { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7 via mitex-spec; only reads trusted, embedded data" },
  # Unmaintained, no vulnerability.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1 unmaintained; via typst -> syntect" },
  { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; via mitex" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; via typst -> hayagriva -> biblatex" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; via typst-layout and krilla" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; via typst, fontdb and mermaid-rs-renderer" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained; via typst -> hayagriva -> serde_yaml" },
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained; via typst -> syntect" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Everything here is compatible with distributing Quire under AGPL-3.0-or-later.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

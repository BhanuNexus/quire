# The CI `perf` job (design §9 speed budgets, docs/design/0.10-perf.md):
# release code generation without LTO, so it builds in minutes. Release
# builds are a little faster still, so budgets met here are met there.
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false

[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: Typst alone made every test binary ~1 GB.
# Our own crates keep full debug info.
debug = false

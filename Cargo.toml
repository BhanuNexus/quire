[workspace]
resolver = "3"
members = [
    "crates/quire-text",
    "crates/quire-markdown",
    "crates/quire-vault",
    "crates/quire-index",
    "crates/quire-intel",
    "crates/quire-app",
    "crates/quire-import",
    "apps/quire-desktop",
    "apps/quire-cli",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/BhanuNexus/quire"
homepage = "https://github.com/BhanuNexus/quire"
readme = "README.md"
keywords = ["markdown", "notes", "editor", "local-first", "egui"]
categories = ["text-editors"]
# Not on crates.io (yet); the crates ship together as the Quire app.
publish = false
authors = ["The Quire contributors"]

[workspace.dependencies]
quire-text = { path = "crates/quire-text" }
quire-markdown = { path = "crates/quire-markdown" }
quire-vault = { path = "crates/quire-vault" }
quire-index = { path = "crates/quire-index" }
quire-intel = { path = "crates/quire-intel" }
quire-app = { path = "crates/quire-app" }
quire-import = { path = "crates/quire-import" }

ropey = "1.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
nucleo-matcher = "0.3"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tempfile = "3"
unicode-segmentation = "1"
thiserror = "2"
crossbeam-channel = "0.5"
ureq = { version = "3", features = ["json"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow", "x11", "wayland", "persistence"] }
egui = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
rfd = "0.17"
regex = "1"
png = "0.18"
egui_extras = { version = "0.37", default-features = false, features = ["file", "image", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2

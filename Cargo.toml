[workspace]
resolver = "3"
members = [
    "crates/quire-text",
    "crates/quire-markdown",
    "crates/quire-vault",
    "crates/quire-index",
    "crates/quire-intel",
    "crates/quire-app",
    "crates/quire-import",
    "crates/quire-sync",
    "crates/quire-spell",
    "crates/quire-typeset",
    "crates/quire-agent",
    "crates/quire-plan",
    "crates/quire-canvas",
    "crates/quire-pdf",
    "crates/quire-ai",
    "crates/quire-mcp",
    "crates/quire-assistant",
    "crates/quire-web",
    "apps/quire-desktop",
    "apps/quire-cli",
    "apps/quire-sync-server",
    "apps/quire-ai-engine",
]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-or-later"
repository = "https://github.com/BhanuNexus/quire"
homepage = "https://github.com/BhanuNexus/quire"
readme = "README.md"
keywords = ["markdown", "notes", "editor", "local-first", "egui"]
categories = ["text-editors"]
# Not on crates.io (yet); the crates ship together as the Quire app.
publish = false
authors = ["The Quire contributors"]

[workspace.dependencies]
quire-text = { path = "crates/quire-text" }
quire-markdown = { path = "crates/quire-markdown" }
quire-vault = { path = "crates/quire-vault" }
quire-index = { path = "crates/quire-index" }
quire-intel = { path = "crates/quire-intel" }
quire-app = { path = "crates/quire-app", default-features = false }
quire-import = { path = "crates/quire-import" }
quire-sync = { path = "crates/quire-sync" }
quire-spell = { path = "crates/quire-spell" }
quire-typeset = { path = "crates/quire-typeset" }
quire-agent = { path = "crates/quire-agent" }
quire-plan = { path = "crates/quire-plan" }
quire-canvas = { path = "crates/quire-canvas" }
# `text` (both editions) is on by default; `render` comes with the full edition.
quire-pdf = { path = "crates/quire-pdf" }
# Consumers add `features = ["client"]`; the engine sidecar uses the protocol only.
quire-ai = { path = "crates/quire-ai", default-features = false }
quire-mcp = { path = "crates/quire-mcp" }
quire-assistant = { path = "crates/quire-assistant" }
# 0.10: the web app of `quire-cli serve`.
quire-web = { path = "crates/quire-web" }

ropey = "1.6"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
nucleo-matcher = "0.3"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tempfile = "3"
unicode-segmentation = "1"
thiserror = "2"
crossbeam-channel = "0.5"
similar = "3"
ureq = { version = "3", features = ["json", "platform-verifier"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "glow", "x11", "wayland", "persistence"] }
egui = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
rfd = "0.17"
regex = "1"
png = "0.18"
egui_extras = { version = "0.37", default-features = false, features = ["file", "image", "gif", "webp"] }
spellbook = "0.4"
global-hotkey = "0.9"
resvg = { version = "0.47", default-features = false, features = ["text"] }
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Typesetting (quire-typeset): Typst as a library, LaTeX math via MiTeX,
# Mermaid diagrams in pure Rust.
typst = "0.15"
typst-layout = "0.15"
typst-svg = "0.15"
typst-pdf = "0.15"
mitex = "0.2"
mermaid-rs-renderer = { version = "0.3", default-features = false }

# Added for 0.9 (docs/design/0.9.md §5). Listed here once so workstreams never
# edit this file; a crate depends on one only when it uses it.
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.23"
axum = "0.8.9"
tokio = { version = "1.54.1", default-features = false }
toml_edit = "0.25"
unicode-normalization = "0.1.26"
strsim = "0.11.1"
dom_smoothie = "0.19.0"
htmd = "0.5.6"
encoding_rs = "0.8.44"
yaml-rust2 = "0.13.0"
notify-rust = "4.18.2"
# 0.7 is what Typst links; 0.8 exists, but two copies would cost size in the full build.
hayro = "0.7"
hayro-interpret = "0.7"
# The geometry types of hayro-interpret's `Device` trait (quire-pdf).
kurbo = "0.13"
biblatex = "0.12.0"
agent-client-protocol-schema = "1.15.1"
half = "2.7.1"
# Engine sidecar only (apps/quire-ai-engine); the WS-D spike decides whether they are used.
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.23.2", default-features = false }
ocrs = "0.13.1"
# ocrs 0.13.1 is built on rten 0.26 (the design named 0.27); one copy, not two.
rten = "0.26"
# Encryption of sync data (quire-sync) and of MCP request states (quire-mcp).
chacha20poly1305 = "0.11"
# The `Stream` trait for MCP event streams (already in the tree through axum).
futures-core = { version = "0.3", default-features = false }
# 0.10 voice notes: microphone capture in the desktop app (full edition;
# links the system ALSA library on Linux).
cpal = { version = "0.18.2", default-features = false }
# Dev-dependencies only (test oracles and interop clients).
rrule = "0.14.0"
fsrs = "6.6.2"
rmcp = "3.8.0"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_numeric_casts = "warn"
redundant_lifetimes = "warn"
unit_bindings = "warn"
missing_unsafe_on_extern = "warn"

[workspace.lints.clippy]
# Groups: everything correctness/style/perf, plus the stricter pedantic and
# nursery sets. CI runs with -D warnings, so all of these are hard errors.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Hand-picked restriction lints.
unwrap_used = "warn"                      # use `expect("why it can't fail")` or handle it (tests are exempt, see clippy.toml)
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes_without_reason = "warn"  # every #[allow] says why
clone_on_ref_ptr = "warn"                 # Rc::clone(&x), not x.clone()
if_then_some_else_none = "warn"
get_unwrap = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
try_err = "warn"
verbose_file_reads = "warn"
empty_drop = "warn"
fn_to_numeric_cast_any = "warn"
large_include_file = "warn"
mixed_read_write_in_expression = "warn"

# Deliberately off, with reasons:
must_use_candidate = "allow"         # would add #[must_use] to ~200 internal fns; we use it where ignoring a result is a real bug
missing_errors_doc = "allow"         # internal crates, not published; errors are typed and self-describing
missing_panics_doc = "allow"         # same; remaining expects carry their reason inline
cast_precision_loss = "allow"        # UI and scoring math converts counts to f32 on purpose
cast_possible_truncation = "allow"   # ditto (pixel sizes, timestamps); values are range-checked where it matters
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"             # egui UI functions are long by nature; split when it helps reading, not for a count
similar_names = "allow"
many_single_char_names = "allow"     # linear algebra (LSA) reads best with math names
struct_excessive_bools = "allow"     # Settings mirrors a TOML file of toggles
missing_const_for_fn = "allow"       # nursery; churn without benefit for non-const callers
option_if_let_else = "allow"         # nursery; map_or_else chains are often less readable
significant_drop_tightening = "allow" # nursery; known false positives with RwLock guards
suboptimal_flops = "allow"           # mul_add changes float results; not worth it in UI code
redundant_pub_crate = "allow"        # conflicts with rustc's unreachable_pub, which we prefer
future_not_send = "allow"            # no async here
multiple_crate_versions = "allow"    # transitive duplicates come from upstream (winit/egui)
suspicious_operation_groupings = "allow" # nursery; flags correct range/selection comparisons

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwind, not abort: math, diagram and PDF rendering run third-party layout
# code on whatever the user typed, and catch its panics (quire-typeset) so a
# bad formula shows an error instead of closing the app.
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 2
# No debug info for dependencies: Typst alone made every test binary ~1 GB.
# Our own crates keep full debug info.
debug = false

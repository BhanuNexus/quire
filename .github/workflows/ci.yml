# Checks every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    # The workspace includes the on-device AI engine (candle, tokenizers,
    # ocrs): a cold cache takes a while.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers (the full edition records voice notes through cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Quire Lite (no math, diagrams or PDF export) builds cleanly too
        run: cargo clippy -p quire-desktop -p quire-cli --no-default-features --all-targets --locked -- -D warnings
      - name: Docs build without warnings (broken intra-doc links etc.)
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  workflows:
    # Security audit of the GitHub Actions workflows themselves.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 --offline --format=github .github/workflows/

  packaging:
    # The release's packaging files, checked on every change, so a mistake in
    # one doesn't wait for the release workflow: the desktop entry and the
    # AppStream file (as the .deb and the Flatpak install them), the Flatpak
    # manifest, the Windows installer script and the shell scripts.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends appstream desktop-file-utils flatpak-builder nsis shellcheck
      - name: Desktop entry (as the packages install it)
        run: |
          sed 's/^Icon=quire$/Icon=io.github.bhanunexus.Quire/' packaging/linux/quire.desktop > "$RUNNER_TEMP/io.github.bhanunexus.Quire.desktop"
          desktop-file-validate "$RUNNER_TEMP/io.github.bhanunexus.Quire.desktop"
          grep -q '^MimeType=text/markdown;' packaging/linux/quire.desktop
          grep -q '^Exec=quire %f$' packaging/linux/quire.desktop
      - name: AppStream file (the current version, and a version with no notes)
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          python3 -I packaging/linux/render-metainfo.py "$version" > "$RUNNER_TEMP/io.github.bhanunexus.Quire.metainfo.xml"
          appstreamcli validate --no-net "$RUNNER_TEMP/io.github.bhanunexus.Quire.metainfo.xml"
          python3 -I packaging/linux/render-metainfo.py 0.0.0-test > "$RUNNER_TEMP/none.metainfo.xml"
          appstreamcli validate --no-net "$RUNNER_TEMP/none.metainfo.xml"
      - name: Flatpak manifest parses (the crate list is generated by the release)
        run: |
          echo '[{"type": "inline", "contents": "x", "dest-filename": "x"}]' > packaging/flatpak/cargo-sources.json
          flatpak-builder --show-manifest packaging/flatpak/io.github.bhanunexus.Quire.yml > "$RUNNER_TEMP/manifest.json" 2> "$RUNNER_TEMP/manifest.err"
          cat "$RUNNER_TEMP/manifest.err"
          # A manifest it can't read still exits 0, with a warning.
          if grep -q WARNING "$RUNNER_TEMP/manifest.err"; then exit 1; fi
          grep -q '"id" : "io.github.bhanunexus.Quire"' "$RUNNER_TEMP/manifest.json"
      - name: Windows installer script compiles (with stand-in files)
        run: |
          mkdir "$RUNNER_TEMP/win"
          for f in quire.exe quire-cli.exe quire-ai-engine.exe README.md; do echo x > "$RUNNER_TEMP/win/$f"; done
          cp LICENSE "$RUNNER_TEMP/win/LICENSE.txt"
          # An absolute script path: makensis changes into the script's folder (as package.sh notes).
          makensis -V2 -DVERSION=0.0.0 -DSRCDIR="$RUNNER_TEMP/win" -DOUTFILE="$RUNNER_TEMP/win/quire-test-setup.exe" -DENGINE "$PWD/packaging/windows/quire.nsi"
          grep -q 'Quire.Markdown' packaging/windows/quire.nsi
      - name: macOS Info.plist doesn't list Markdown files (docs/design/0.13-pack.md §3)
        run: |
          python3 -I -c "
          import plistlib
          d = plistlib.load(open('packaging/macos/Info.plist', 'rb'))
          assert 'CFBundleDocumentTypes' not in d, 'Finder would offer Quire for .md, which fails until the open-file event is handled'
          assert 'UTImportedTypeDeclarations' not in d
          "
      - name: Shell scripts (errors only; the scripts predate this check's warnings)
        run: shellcheck --severity=error packaging/*.sh packaging/linux/*.sh packaging/macos/*.sh packaging/windows/*.sh packaging/flatpak/*.sh

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@4c8b7f51ca60df14e3c5ca82770dfbbe6c3dae85 # v1.52.0

  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: native ARM64 Linux, so a release's arm64 builds
        # aren't the first time this code runs there (free for public repositories).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # Includes building candle for the AI engine (cold cache: 10+ minutes more).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers (the full edition records voice notes through cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install the pinned toolchain (rust-toolchain.toml)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Release script tests (engine pins, as on each release runner)
        shell: bash
        run: packaging/test-unpack-engine.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked --no-fail-fast
      - name: Quire Lite tests (the desktop and CLI without the typesetter)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p quire-desktop -p quire-cli --no-default-features --locked
      - name: PDF rendering tests (behind the full edition's `render` feature)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p quire-pdf --features render --locked
      - name: Agent edit eval (synthetic edits against the MCP tools, design §B.6)
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p quire-cli --features eval --locked -- eval synthetic-edits --json

  perf:
    # The design §9 speed budgets on an optimised build (`[profile.perf]`:
    # release without LTO, so it builds in minutes). Medians of several
    # runs; fails above budget x 1.25 (docs/design/0.10-perf.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers, Xvfb and software OpenGL (the desktop runs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: perf
      - name: Build quire-cli and the desktop with its bench runs
        run: cargo build --profile perf --locked -p quire-cli -p quire-desktop --features quire-desktop/bench
      - name: Speed budgets
        env:
          QUIRE_BENCH_PDFS: crates/quire-pdf/tests/fixtures
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          python3 packaging/perf-check.py --cli target/perf/quire-cli --app target/perf/quire
          --runs 5 --app-runs 5 --json perf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-results
          path: perf.json
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off (see CONTRIBUTING.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line. Use 'git commit -s' (or 'git rebase --signoff $BASE')."
              missing=1
            fi
          done
          exit $missing

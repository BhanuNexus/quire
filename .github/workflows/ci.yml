# Checks every push to main and every pull request.
#
# Pushes to main run everything (the release's tag guard needs those runs).
# A pull request runs only what its diff can change: the `changes` job lists the
# affected workspace crates (packaging/affected-crates.py), and the Rust jobs are
# skipped, by job-level `if:`, when no crate is affected (a docs-only change). A
# skipped job counts as passed for branch protection and the tag guard. Do not
# turn this into `paths-ignore`: a required check would then stay pending.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables only for the debug and test builds (0.13.1): panics and
  # backtraces still name the file and line, while the test binaries, their
  # links and the build caches are much smaller than with full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # crates/quire-sync/tests/remote.rs `real_servers` fails in CI unless told to
  # skip: the weekly workflow real-servers.yml is the one that runs it.
  QUIRE_SYNC_REAL_SERVERS: skip

jobs:
  changes:
    # Which Rust jobs have work? On a pull request: the crates the diff touches
    # plus their dependents (docs-only: none). On main: everything.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      everything: ${{ steps.classify.outputs.everything }}
      crates: ${{ steps.classify.outputs.crates }}
      rust: ${{ steps.classify.outputs.rust }}
      packaging: ${{ steps.classify.outputs.packaging }}
      lite: ${{ steps.classify.outputs.lite }}
      pdf: ${{ steps.classify.outputs.pdf }}
      eval: ${{ steps.classify.outputs.eval }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the change (git diff and cargo metadata; builds nothing)
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUSTUP_TOOLCHAIN: stable
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' everything=true crates= rust=true packaging=true lite=true pdf=true eval=true >> "$GITHUB_OUTPUT"
          else
            python3 -I packaging/affected-crates.py --base "$BASE" --head "$HEAD" --format github | tee -a "$GITHUB_OUTPUT"
          fi

  changelog:
    # Warns (the owner's decision: a warning, not a gate) when a pull request
    # changes source under crates/ or apps/ (not tests, fixtures or *.md) and
    # not CHANGELOG.md, unless it is labelled `no-changelog` or comes from
    # Dependabot (packaging/check-changelog.py). To make it block, remove
    # `continue-on-error` below. Skipped on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changelog line, or the no-changelog label
        continue-on-error: true
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # The pull request's author: a re-run or a push by someone else
          # to a Dependabot branch does not change it.
          ACTOR: ${{ github.event.pull_request.user.login }}
        run: python3 -I packaging/check-changelog.py --base "$BASE" --head "$HEAD" --labels "$LABELS" --actor "$ACTOR"

  lint:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    # The workspace includes the on-device AI engine (candle, tokenizers,
    # ocrs): a cold cache takes a while.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers (the full edition records voice notes through cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          # Pull requests restore main's caches but don't save their own: saving
          # takes minutes, and seven jobs' caches overflow the repository's
          # 10 GB, which evicted main's and left every run cold (0.13.1).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Quire Lite (no math, diagrams or PDF export) builds cleanly too
        run: cargo clippy -p quire-desktop -p quire-cli --no-default-features --all-targets --locked -- -D warnings
      - name: Docs build without warnings (broken intra-doc links etc.)
        run: cargo doc --workspace --no-deps --document-private-items --locked
        env:
          RUSTDOCFLAGS: -D warnings

  workflows:
    # Security audit of the GitHub Actions workflows themselves.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run zizmor==1.31.1 --offline --format=github .github/workflows/

  packaging:
    # The release's packaging files, checked on every change, so a mistake in
    # one doesn't wait for the release workflow: the desktop entry and the
    # AppStream file (as the .deb and the Flatpak install them), the Flatpak
    # manifest, the Windows installer script and the shell scripts.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the validators
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends appstream desktop-file-utils flatpak-builder nsis shellcheck
      - name: Desktop entry (as the packages install it)
        run: |
          sed 's/^Icon=quire$/Icon=io.github.bhanunexus.Quire/' packaging/linux/quire.desktop > "$RUNNER_TEMP/io.github.bhanunexus.Quire.desktop"
          desktop-file-validate "$RUNNER_TEMP/io.github.bhanunexus.Quire.desktop"
          grep -q '^MimeType=text/markdown;' packaging/linux/quire.desktop
          grep -q '^Exec=quire %f$' packaging/linux/quire.desktop
      - name: AppStream file (the current version, and a version with no notes)
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          python3 -I packaging/linux/render-metainfo.py "$version" > "$RUNNER_TEMP/io.github.bhanunexus.Quire.metainfo.xml"
          appstreamcli validate --no-net "$RUNNER_TEMP/io.github.bhanunexus.Quire.metainfo.xml"
          python3 -I packaging/linux/render-metainfo.py 0.0.0-test > "$RUNNER_TEMP/none.metainfo.xml"
          appstreamcli validate --no-net "$RUNNER_TEMP/none.metainfo.xml"
      - name: Flatpak manifest parses (the crate list is generated by the release)
        run: |
          echo '[{"type": "inline", "contents": "x", "dest-filename": "x"}]' > packaging/flatpak/cargo-sources.json
          flatpak-builder --show-manifest packaging/flatpak/io.github.bhanunexus.Quire.yml > "$RUNNER_TEMP/manifest.json" 2> "$RUNNER_TEMP/manifest.err"
          cat "$RUNNER_TEMP/manifest.err"
          # A manifest it can't read still exits 0, with a warning.
          if grep -q WARNING "$RUNNER_TEMP/manifest.err"; then exit 1; fi
          grep -q '"id" : "io.github.bhanunexus.Quire"' "$RUNNER_TEMP/manifest.json"
      - name: Windows installer script compiles (with stand-in files)
        run: |
          mkdir "$RUNNER_TEMP/win"
          for f in quire.exe quire-cli.exe quire-ai-engine.exe README.md; do echo x > "$RUNNER_TEMP/win/$f"; done
          cp LICENSE "$RUNNER_TEMP/win/LICENSE.txt"
          # An absolute script path: makensis changes into the script's folder (as package.sh notes).
          makensis -V2 -DVERSION=0.0.0 -DSRCDIR="$RUNNER_TEMP/win" -DOUTFILE="$RUNNER_TEMP/win/quire-test-setup.exe" -DENGINE "$PWD/packaging/windows/quire.nsi"
          grep -q 'Quire.Markdown' packaging/windows/quire.nsi
      - name: macOS Info.plist doesn't list Markdown files (docs/design/0.13-pack.md §3)
        run: |
          python3 -I -c "
          import plistlib
          d = plistlib.load(open('packaging/macos/Info.plist', 'rb'))
          assert 'CFBundleDocumentTypes' not in d, 'Finder would offer Quire for .md, which fails until the open-file event is handled'
          assert 'UTImportedTypeDeclarations' not in d
          "
      - name: Shell scripts (errors only; the scripts predate this check's warnings)
        run: shellcheck --severity=error packaging/*.sh packaging/linux/*.sh packaging/macos/*.sh packaging/windows/*.sh packaging/flatpak/*.sh apps/quire-sync-server/*.sh
      - name: Release file set, SHA256SUMS and CI-check scripts (stand-in files and made-up API answers)
        run: |
          packaging/test-release-files.sh
          packaging/test-check-ci-green.sh
      - name: Crate layering (ARCHITECTURE.md's layer table against cargo metadata; builds nothing)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          python3 -I packaging/test-check-layering.py
          python3 -I packaging/check-layering.py
      - name: Affected-crates script (which crates a pull request tests)
        run: python3 -I packaging/test-affected-crates.py
      - name: Changelog check script (made-up path lists and a throwaway git repository)
        run: python3 -I packaging/test-check-changelog.py
      - name: Ratchet script (the weekly count of rules that may only go down; made-up clippy output)
        run: python3 -I packaging/test-ratchet.py
      - name: Design notes carry a status block, are listed, and link only inside the repository
        run: |
          packaging/test-check-design-notes.sh
          packaging/check-design-notes.sh
      - name: Code comments carry no workstream labels or bare design-section references
        run: |
          packaging/test-check-comment-labels.sh
          packaging/check-comment-labels.sh

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  test:
    needs: changes
    # Pull requests: only when a crate is affected (or packaging changed, for the
    # engine-pin script below). Main: always.
    if: github.event_name != 'pull_request' || needs.changes.outputs.crates != '' || needs.changes.outputs.packaging == 'true'
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: native ARM64 Linux, so a release's arm64 builds
        # aren't the first time this code runs there (free for public repositories).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    # Includes building candle for the AI engine (cold cache: 10+ minutes more).
    timeout-minutes: 50
    env:
      # The randomised folder-sync tests (crates/quire-sync/tests/folder_sync.rs)
      # read this: 150 seeds by default. 30 on macOS and Windows saves minutes
      # there (four 150-seed tests ran 60 to 152 s each on Windows); Linux keeps 150.
      SYNC_SEEDS: ${{ (startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'windows')) && '30' || '150' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers (the full edition records voice notes through cpal)
        if: runner.os == 'Linux' && (github.event_name != 'pull_request' || needs.changes.outputs.crates != '')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install the pinned toolchain (rust-toolchain.toml)
        if: github.event_name != 'pull_request' || needs.changes.outputs.crates != ''
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - name: Release script tests (engine pins, as on each release runner)
        shell: bash
        run: packaging/test-unpack-engine.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: github.event_name != 'pull_request' || needs.changes.outputs.crates != ''
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        if: github.event_name != 'pull_request' || needs.changes.outputs.crates != ''
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-nextest@0.9.150
      - name: Tests (the affected crates on a pull request, the whole workspace on main)
        id: nextest
        if: github.event_name != 'pull_request' || needs.changes.outputs.crates != ''
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          EVERYTHING: ${{ needs.changes.outputs.everything }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          # Profile `ci` (.config/nextest.toml): no fail-fast, and a test over
          # 5 minutes is terminated. JUnit goes to target/nextest/ci/junit.xml.
          if [ "$EVENT" != pull_request ] || [ "$EVERYTHING" = true ]; then
            args=(--workspace)
          else
            args=()
            for c in $CRATES; do args+=(-p "$c"); done
          fi
          echo "Testing: ${args[*]}"
          cargo nextest run "${args[@]}" --locked --profile ci
      - name: Doctests (nextest does not run them)
        # After a failed nextest run too, so one report shows both.
        if: ${{ !cancelled() && steps.nextest.conclusion != 'skipped' }}
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          EVERYTHING: ${{ needs.changes.outputs.everything }}
          CRATES: ${{ needs.changes.outputs.crates }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$EVERYTHING" = true ]; then
            args=(--workspace)
          else
            # Only crates with a library have doctests: `cargo test --doc -p`
            # on an app alone (quire-cli, quire-desktop) fails with "no library
            # targets found".
            libs=$(cargo metadata --no-deps --format-version 1 --locked |
              jq -r '.packages[] | select(any(.targets[]; .kind | index("lib"))) | .name')
            args=()
            for c in $CRATES; do
              if grep -qxF "$c" <<<"$libs"; then args+=(-p "$c"); fi
            done
            if [ ${#args[@]} -eq 0 ]; then
              echo "No library among the affected crates: no doctests to run."
              exit 0
            fi
          fi
          cargo test --doc "${args[@]}" --locked --no-fail-fast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.nextest.conclusion != 'skipped' }}
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
          retention-days: 14

  test-features:
    # The Linux runs of other feature sets, beside the test matrix instead of
    # after the workspace tests in its ubuntu-latest job (0.13.1): each
    # rebuilds part of the tree with other features, which added to that
    # job's time one after another.
    needs: changes
    # Pull requests: only when the Lite apps or quire-pdf are affected; each step below says which.
    if: github.event_name != 'pull_request' || needs.changes.outputs.lite == 'true' || needs.changes.outputs.pdf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers (the full edition records voice notes through cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Quire Lite tests (the desktop and CLI without the typesetter)
        if: github.event_name != 'pull_request' || needs.changes.outputs.lite == 'true'
        run: cargo test -p quire-desktop -p quire-cli --no-default-features --locked
      - name: PDF rendering tests (behind the full edition's `render` feature)
        if: github.event_name != 'pull_request' || needs.changes.outputs.pdf == 'true'
        run: cargo test -p quire-pdf --features render --locked
      - name: Agent edit eval (synthetic edits against the MCP tools, design §B.6)
        if: github.event_name != 'pull_request' || needs.changes.outputs.eval == 'true'
        run: cargo run -p quire-cli --features eval --locked -- eval synthetic-edits --json

  perf:
    # The design §9 speed budgets on an optimised build (`[profile.perf]`:
    # release without LTO, so it builds in minutes). Medians of several
    # runs; fails above budget x 1.25 (docs/design/0.10-perf.md).
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA headers, Xvfb and software OpenGL (the desktop runs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: perf
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build quire-cli and the desktop with its bench runs
        run: cargo build --profile perf --locked -p quire-cli -p quire-desktop --features quire-desktop/bench
      - name: Speed budgets
        env:
          QUIRE_BENCH_PDFS: crates/quire-pdf/tests/fixtures
        run: >-
          xvfb-run -a -s "-screen 0 1600x1000x24"
          python3 packaging/perf-check.py --cli target/perf/quire-cli --app target/perf/quire
          --runs 5 --app-runs 5 --json perf.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-results
          path: perf.json
          if-no-files-found: ignore

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check advisories bans licenses sources

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off (see CONTRIBUTING.md)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line. Use 'git commit -s' (or 'git rebase --signoff $BASE')."
              missing=1
            fi
          done
          exit $missing

  ci-result:
    # One check that is green when every job above succeeded or was skipped. A
    # skipped matrix job reports one check named `test`, not one per leg, so
    # branch protection should require this job (or the unmatrixed jobs), not the
    # `test (<os>)` names.
    if: always()
    needs: [changes, changelog, lint, workflows, packaging, typos, test, test-features, perf, deny, dco]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: No job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if printf '%s' "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "::error::A job failed or was cancelled."
            exit 1
          fi

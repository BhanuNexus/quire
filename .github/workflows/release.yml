# Release pipeline: build → attest → publish an immutable GitHub release.
#
# Push a tag `vX.Y.Z` (matching Cargo.toml and a CHANGELOG.md section) to
# release, or run the "Tag release" workflow, which creates the tag and starts
# this one on it. Run this by hand on a branch for a dry run: same builds,
# uploaded as workflow artifacts only (no attestations, no release).
#
# Every published file gets:
#   * a build-provenance attestation (`gh attestation verify <file> --repo BhanuNexus/quire`)
#   * an entry in SHA256SUMS
#   * an SBOM (SPDX) of the Rust dependencies, attested against the binaries
#
# With "immutable releases" enabled in the repository settings, a published
# release's tag and assets can't be changed. That's why this workflow uploads
# everything to a draft first and publishes last.
#
# Release builds never restore build caches, so a poisoned cache can't
# end up in a shipped binary (they're slower, and that's fine).
#
# Optional signing secrets (unsigned builds work; see RELEASING.md):
#   macOS:   MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$IS_RELEASE" = "true" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
              exit 1
            fi
            packaging/release-notes.sh "$version" > /dev/null
          fi
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --workspace --locked

  linux:
    needs: check
    # Oldest supported runner, so the binary runs on older glibc (2.35+).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build tar.gz, .deb and AppImage
        run: |
          eval "$(packaging/linux/fetch-appimagetool.sh "$RUNNER_TEMP/appimage")"
          packaging/linux/package.sh
      - name: Smoke-test the packages
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/Quire-*-linux-amd64.deb
          quire --version && quire-cli --version
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/Quire-*-linux-x86_64.AppImage --version
          tar -xzf dist/Quire-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/Quire-*-linux-x86_64/quire-cli --version
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - run: packaging/macos/package.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: dist/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-macos
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - name: Install NSIS if missing
        run: command -v makensis || choco install nsis -y --no-progress
      - name: Put NSIS and signtool on PATH
        run: |
          echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          kit="$(find "/c/Program Files (x86)/Windows Kits/10/bin" -maxdepth 2 -path '*/10.*/x64' -type d 2>/dev/null | sort -V | tail -1)"
          if [ -n "$kit" ]; then echo "$kit" >> "$GITHUB_PATH"; fi
      - name: Write signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          echo "WINDOWS_CERT_PFX=$(cygpath -w "$RUNNER_TEMP/cert.pfx")" >> "$GITHUB_ENV"
          echo "WINDOWS_CERT_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
      - run: packaging/windows/package.sh msvc
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  sbom:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: Quire-${{ needs.check.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-sbom
          path: Quire-*-sbom.spdx.json
          if-no-files-found: error

  publish:
    needs: [check, linux, macos, windows, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment (Settings → Environments)
    # to approve each release before it's published.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          sbom-path: dist/Quire-${{ env.VERSION }}-sbom.spdx.json
      - name: Create draft release with all assets
        run: |
          packaging/release-notes.sh "$VERSION" > notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Quire $VERSION" --notes-file notes.md $prerelease dist/*
      - name: Publish (immutable from here on)
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

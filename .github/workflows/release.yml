# Release pipeline: build → attest → publish an immutable GitHub release.
#
# Push a tag `vX.Y.Z` (matching Cargo.toml and a CHANGELOG.md section) to
# release, or run the "Tag release" workflow, which creates the tag and starts
# this one on it. Run this by hand on a branch for a dry run: same builds,
# uploaded as workflow artifacts only (no attestations, no release).
#
# Linux builds natively for x86_64 and ARM64 (GitHub's arm64 runners; nothing
# is cross-compiled), and a Flatpak is built from source for each.
#
# Every published file gets:
#   * a build-provenance attestation (`gh attestation verify <file> --repo BhanuNexus/quire`)
#   * an entry in SHA256SUMS
#   * an SBOM (SPDX) of the Rust dependencies, attested against the binaries
#
# With "immutable releases" enabled in the repository settings, a published
# release's tag and assets can't be changed. That's why this workflow uploads
# everything to a draft first and publishes last.
#
# Release builds never restore build caches, so a poisoned cache can't
# end up in a shipped binary (they're slower, and that's fine).
#
# Optional signing secrets (unsigned builds work; see RELEASING.md):
#   macOS:   MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  # On-device AI ships disabled behind its experimental switch until its
  # models are pinned (design §D.1), so for now unpinned models only warn.
  # For the release that turns it on: pin them (`python3 packaging/pin-models.py`), then set this to
  # "true" so a tag release fails again while any model is unpinned.
  REQUIRE_MODEL_PINS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    # The workspace tests build candle for the AI engine (as CI's test job does).
    timeout-minutes: 50
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$IS_RELEASE" = "true" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
              exit 1
            fi
            packaging/release-notes.sh "$version" > /dev/null
          fi
      - name: On-device models are pinned (tag releases only)
        # Unpinned models are never downloaded (Settings says "Not available
        # in this build"), so dry runs and branches build without pins. With
        # REQUIRE_MODEL_PINS (above) a tag release must not ship that way
        # (design §D.2); without it this is a warning.
        if: env.IS_RELEASE == 'true'
        run: |
          if [ "$REQUIRE_MODEL_PINS" = "true" ]; then
            python3 packaging/pin-models.py --check
          else
            python3 packaging/pin-models.py --check --warn
          fi
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: ALSA headers (the full edition records voice notes through cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - run: cargo test --workspace --locked

  # The on-device AI engine (design §D.3): built per target first, so each
  # app build can embed the SHA-256 of the engine it may download
  # (crates/quire-ai/engine.sha256.<target>). One engine serves both editions:
  # the full edition's packages include it (next to the app, checked against
  # crates/quire-ai/engine.bundled.sha256, written by the packaging scripts);
  # Quire Lite downloads it when on-device AI is turned on.
  engine:
    needs: check
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, features: "" }
          # Native on GitHub's arm64 runner; 22.04 like x86_64, so glibc 2.35+.
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, features: "" }
          - { os: macos-15, target: aarch64-apple-darwin, features: "--features metal" }
          - { os: macos-15, target: x86_64-apple-darwin, features: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, features: "" }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Build the engine
        run: cargo build --release --locked --target "$TARGET" -p quire-ai-engine --bin quire-ai-engine ${{ matrix.features }}
      - name: Compress, pin and check the size budget
        run: |
          mkdir -p dist pins
          exe=""; case "$TARGET" in *windows*) exe=".exe" ;; esac
          bin="target/$TARGET/release/quire-ai-engine$exe"
          gzip -9 -n -c "$bin" > "dist/quire-ai-engine-$TARGET.gz"
          # From stdin: only the 64 hex digits, never a "*" marker or an escaped file name.
          sha() { if command -v sha256sum >/dev/null; then sha256sum < "$1"; else shasum -a 256 < "$1"; fi | cut -c1-64; }
          size=$(wc -c < "dist/quire-ai-engine-$TARGET.gz" | tr -d ' ')
          echo "$(sha "dist/quire-ai-engine-$TARGET.gz") $size $(sha "$bin")" > "pins/engine.sha256.$TARGET"
          cat "pins/engine.sha256.$TARGET"
          packaging/check-size.sh "dist/quire-ai-engine-$TARGET.gz" engine
      - name: Smoke-test the engine
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          exe=""; case "$TARGET" in *windows*) exe=".exe" ;; esac
          "target/$TARGET/release/quire-ai-engine$exe" --version
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: dist/quire-ai-engine-*.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-engine-${{ matrix.target }}
          path: dist/quire-ai-engine-*.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pins-${{ matrix.target }}
          path: pins/engine.sha256.*
          if-no-files-found: error

  linux:
    needs: [check, engine]
    # Oldest supported runner, so the binary runs on older glibc (2.35+),
    # natively for each architecture (the arm64 runner is free for public repositories).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      # Every release has both editions: Quire (full) and Quire Lite (no
      # math, diagrams or PDF export), for x86_64 and ARM64. Built side by side.
      fail-fast: true
      matrix:
        edition: [full, lite]
        arch: [x86_64, aarch64]
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64 }
    env:
      EDITION: ${{ matrix.edition }}
      ARCH: ${{ matrix.arch }}
      DEB_ARCH: ${{ matrix.deb }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pins-*
          path: crates/quire-ai
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.edition == 'full'
        with:
          name: quire-engine-${{ matrix.arch }}-unknown-linux-gnu
          path: ${{ runner.temp }}/engine
      - name: Unpack the engine to bundle (full edition)
        if: matrix.edition == 'full'
        run: |
          engine="$(packaging/unpack-engine.sh "$RUNNER_TEMP/engine/quire-ai-engine-$ARCH-unknown-linux-gnu.gz" \
            "$ARCH-unknown-linux-gnu" "$RUNNER_TEMP/engine/quire-ai-engine")"
          echo "ENGINE_BIN=$engine" >> "$GITHUB_ENV"
      - name: ALSA headers (the full edition records voice notes through cpal)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build tar.gz, .deb and AppImage
        run: |
          packaging/linux/fetch-appimagetool.sh "$RUNNER_TEMP/appimage" "$ARCH" > "$RUNNER_TEMP/appimage.env"
          . "$RUNNER_TEMP/appimage.env"
          packaging/linux/package.sh
          test -f dist/Quire-*-linux-"$ARCH".AppImage
      - name: Binary size budget (design 0.9 §2.3)
        run: packaging/check-size.sh "target/$ARCH-unknown-linux-gnu/release/quire" "$EDITION"
      - name: Smoke-test the packages
        run: |
          sudo apt-get install -y --no-install-recommends ./dist/Quire-*-linux-"$DEB_ARCH".deb
          quire --version && quire-cli --version
          # Each edition says which it is.
          if [ "$EDITION" = lite ]; then quire --version | grep -q "(Lite)"; elif quire --version | grep -q Lite; then exit 1; fi
          # The package is for this machine's architecture, and says so.
          test "$(dpkg --print-architecture)" = "$DEB_ARCH"
          file -L "$(command -v quire)" | grep -q "$([ "$ARCH" = aarch64 ] && echo aarch64 || echo x86-64)"
          # The desktop entry lists Markdown files and takes a file argument
          # (CI's packaging job validates the entry and the AppStream file).
          grep -q '^MimeType=text/markdown;' /usr/share/applications/io.github.bhanunexus.Quire.desktop
          grep -q '^Exec=quire %f$' /usr/share/applications/io.github.bhanunexus.Quire.desktop
          appimage=(dist/Quire-*-linux-"$ARCH".AppImage)
          APPIMAGE_EXTRACT_AND_RUN=1 "./${appimage[0]}" --version
          tar -xzf dist/Quire-*-linux-"$ARCH".tar.gz -C "$RUNNER_TEMP"
          extracted=("$RUNNER_TEMP"/Quire-*-linux-"$ARCH")
          "${extracted[0]}/quire-cli" --version
          # The sync server is built on x86_64 only (docs/design/0.13-pack.md).
          if [ "$EDITION" = full ] && [ "$ARCH" = x86_64 ]; then
            tar -xzf dist/quire-sync-server-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
            server=("$RUNNER_TEMP"/quire-sync-server-*-linux-x86_64)
            "${server[0]}/quire-sync-server" --version
          fi
      - name: The full edition includes the engine, Quire Lite doesn't
        run: |
          # Listings go to files first: `grep -q` closing a pipe early would
          # fail the step under pipefail.
          dpkg-deb -c dist/Quire-*-linux-"$DEB_ARCH".deb > "$RUNNER_TEMP/deb.txt"
          tar -tzf dist/Quire-*-linux-"$ARCH".tar.gz > "$RUNNER_TEMP/tar.txt"
          appimage=(dist/Quire-*-linux-"$ARCH".AppImage)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/${appimage[0]}" --appimage-extract > /dev/null)
          appdir="$RUNNER_TEMP/squashfs-root"
          tardir="$(echo "$RUNNER_TEMP"/Quire-*-linux-"$ARCH")"
          if [ "$EDITION" = full ]; then
            grep -q ' \./usr/bin/quire-ai-engine$' "$RUNNER_TEMP/deb.txt"
            grep -q '^Quire-[^/]*/quire-ai-engine$' "$RUNNER_TEMP/tar.txt"
            for engine in /usr/bin/quire-ai-engine "$tardir/quire-ai-engine" "$appdir/usr/bin/quire-ai-engine"; do
              "$engine" --version
            done
            # The app finds the engine next to it, checks it against the
            # hash it was built with, and talks to it.
            export QUIRE_EXPERIMENTAL_ON_DEVICE=1
            quire-cli ai engine | tee "$RUNNER_TEMP/engine.txt"
            grep -q '^/usr/bin/quire-ai-engine ' "$RUNNER_TEMP/engine.txt"
            "$tardir/quire-cli" ai engine
            # A changed engine next to the app is refused before it starts.
            printf x >> "$tardir/quire-ai-engine"
            if "$tardir/quire-cli" ai engine 2> "$RUNNER_TEMP/refused.txt"; then exit 1; fi
            grep -q "Reinstall Quire" "$RUNNER_TEMP/refused.txt"
          else
            if grep -q quire-ai-engine "$RUNNER_TEMP/deb.txt" "$RUNNER_TEMP/tar.txt"; then exit 1; fi
            test ! -e /usr/bin/quire-ai-engine
            test ! -e "$appdir/usr/bin/quire-ai-engine"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-linux-${{ matrix.edition }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  macos:
    needs: [check, engine]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        edition: [full, lite]
    env:
      EDITION: ${{ matrix.edition }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pins-*
          path: crates/quire-ai
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.edition == 'full'
        with:
          pattern: quire-engine-*-apple-darwin
          path: ${{ runner.temp }}/engine
          merge-multiple: true
      - name: Unpack the engines and make the universal one to bundle (full edition)
        # Each thin engine is checked against its own pin first. lipo and
        # signing change the bytes, so package.sh signs the universal engine
        # and builds the app with the hash of that file
        # (crates/quire-ai/engine.bundled.sha256), the same in both slices.
        if: matrix.edition == 'full'
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            packaging/unpack-engine.sh "$RUNNER_TEMP/engine/quire-ai-engine-$t.gz" "$t" "$RUNNER_TEMP/engine/$t/quire-ai-engine"
          done
          lipo -create -output "$RUNNER_TEMP/engine/quire-ai-engine" \
            "$RUNNER_TEMP/engine/aarch64-apple-darwin/quire-ai-engine" "$RUNNER_TEMP/engine/x86_64-apple-darwin/quire-ai-engine"
          lipo -info "$RUNNER_TEMP/engine/quire-ai-engine"
          "$RUNNER_TEMP/engine/quire-ai-engine" --version
          echo "ENGINE_BIN=$RUNNER_TEMP/engine/quire-ai-engine" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain and targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/cert.p12"
      - run: packaging/macos/package.sh
      - name: The app lists Markdown (.md) files for "Open With"
        run: |
          plutil -p dist/Quire.app/Contents/Info.plist > "$RUNNER_TEMP/plist.txt"
          grep -q 'CFBundleDocumentTypes' "$RUNNER_TEMP/plist.txt"
          grep -q 'net.daringfireball.markdown' "$RUNNER_TEMP/plist.txt"
      - name: The full edition includes the engine, Quire Lite doesn't
        run: |
          engine=dist/Quire.app/Contents/MacOS/quire-ai-engine
          if [ "$EDITION" = full ]; then
            lipo "$engine" -verify_arch arm64 x86_64
            "$engine" --version
            QUIRE_EXPERIMENTAL_ON_DEVICE=1 dist/Quire.app/Contents/MacOS/quire-cli ai engine
          else
            test ! -e "$engine"
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: dist/*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-macos-${{ matrix.edition }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    needs: [check, engine]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        edition: [full, lite]
    env:
      EDITION: ${{ matrix.edition }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pins-*
          path: crates/quire-ai
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.edition == 'full'
        with:
          name: quire-engine-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/engine
      - name: Unpack the engine to bundle (full edition)
        if: matrix.edition == 'full'
        run: |
          engine="$(packaging/unpack-engine.sh "$RUNNER_TEMP/engine/quire-ai-engine-x86_64-pc-windows-msvc.gz" \
            x86_64-pc-windows-msvc "$RUNNER_TEMP/engine/quire-ai-engine.exe")"
          echo "ENGINE_BIN=$engine" >> "$GITHUB_ENV"
      - name: Install the pinned toolchain and target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc
      - name: Install NSIS if missing
        run: command -v makensis || choco install nsis -y --no-progress
      - name: Put NSIS and signtool on PATH
        run: |
          echo "/c/Program Files (x86)/NSIS" >> "$GITHUB_PATH"
          kit="$(find "/c/Program Files (x86)/Windows Kits/10/bin" -maxdepth 2 -path '*/10.*/x64' -type d 2>/dev/null | sort -V | tail -1)"
          if [ -n "$kit" ]; then echo "$kit" >> "$GITHUB_PATH"; fi
      - name: Write signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        run: |
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
          echo "WINDOWS_CERT_PFX=$(cygpath -w "$RUNNER_TEMP/cert.pfx")" >> "$GITHUB_ENV"
          echo "WINDOWS_CERT_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
      - run: packaging/windows/package.sh msvc
      - name: The full edition includes the engine, Quire Lite doesn't
        run: |
          python -c "import sys, zipfile; print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" dist/*-portable.zip | tr -d "\r" > "$RUNNER_TEMP/zip.txt"
          cat "$RUNNER_TEMP/zip.txt"
          if [ "$EDITION" = full ]; then
            grep -qx 'quire-ai-engine\.exe' "$RUNNER_TEMP/zip.txt"
            dist/windows-stage/quire-ai-engine.exe --version
            QUIRE_EXPERIMENTAL_ON_DEVICE=1 dist/windows-stage/quire-cli.exe ai engine
          elif grep -q quire-ai-engine "$RUNNER_TEMP/zip.txt"; then
            exit 1
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-windows-${{ matrix.edition }}
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  # The Flatpak is built from source (the Flathub way), for the full edition
  # only, offline: Cargo.lock becomes a list of crates with checksums first
  # (packaging/flatpak/update-cargo-sources.sh). No build cache is restored.
  flatpak-sources:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List the crates for the offline Flatpak build
        run: packaging/flatpak/update-cargo-sources.sh packaging/flatpak/cargo-sources.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not `quire-*`: the publish job takes only those, and this isn't a release file.
          name: flatpak-cargo-sources
          path: packaging/flatpak/cargo-sources.json
          if-no-files-found: error

  flatpak:
    needs: [check, flatpak-sources]
    runs-on: ${{ matrix.runner }}
    # flatpak-builder needs namespaces the runner's own AppArmor profile
    # refuses, so the build runs in Flathub's builder image, as the action's
    # README does. The image has flatpak, flatpak-builder, the 26.08 runtime
    # and SDK, and flatpak-builder-lint.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    # Rust, from source, with no cache: the longest job of the release.
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      BUNDLE: Quire-${{ needs.check.outputs.version }}-linux-${{ matrix.arch }}.flatpak
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak-cargo-sources
          path: packaging/flatpak
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: packaging/flatpak/io.github.bhanunexus.Quire.yml
          arch: ${{ matrix.arch }}
          cache: false
          upload-artifact: false
      - name: Smoke-test the bundle
        run: |
          flatpak install --user --noninteractive --assumeyes "./$BUNDLE"
          app=io.github.bhanunexus.Quire
          flatpak run "$app" --version | tee "$RUNNER_TEMP/version.txt"
          grep -q '^Quire ' "$RUNNER_TEMP/version.txt"
          if grep -q Lite "$RUNNER_TEMP/version.txt"; then exit 1; fi
          flatpak run --command=quire-cli "$app" --version
          flatpak run --command=/app/bin/quire-ai-engine "$app" --version
          # The app finds the engine next to it and checks it against the hash it was built with.
          flatpak run --env=QUIRE_EXPERIMENTAL_ON_DEVICE=1 --command=quire-cli "$app" ai engine | tee "$RUNNER_TEMP/engine.txt"
          grep -q '^/app/bin/quire-ai-engine ' "$RUNNER_TEMP/engine.txt"
          # The files Flatpak exports: the desktop entry lists Markdown, the icon is there.
          export_dir="$HOME/.local/share/flatpak/app/$app/current/active/export/share"
          grep -q '^MimeType=text/markdown;' "$export_dir/applications/$app.desktop"
          test -f "$export_dir/icons/hicolor/128x128/apps/$app.png"
      - name: Lint the manifest with Flathub's linter (informational)
        # What Flathub's reviewers will see: expect findings about the home
        # folder access and the bundled engine until a submission is prepared
        # (packaging/flatpak/README.md). Not a gate.
        continue-on-error: true
        run: flatpak-builder-lint manifest packaging/flatpak/io.github.bhanunexus.Quire.yml
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.IS_RELEASE == 'true'
        with:
          subject-path: ${{ env.BUNDLE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-flatpak-${{ matrix.arch }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  sbom:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: Quire-${{ needs.check.outputs.version }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quire-sbom
          path: Quire-*-sbom.spdx.json
          if-no-files-found: error

  publish:
    needs: [check, engine, linux, flatpak, macos, windows, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Add required reviewers to this environment (Settings → Environments)
    # to approve each release before it's published.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Release files only: every `quire-*` artifact (the packages, the
          # engine assets, the SBOM, the Flatpak bundles). Not the engine
          # pins (compiled into the apps) or the Flatpak's crate list.
          pattern: quire-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          # A file that isn't a release file stays out of the release and the checksums.
          rm -f engine.sha256.* cargo-sources.json
          ls -1
          sha256sum -- * | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.flatpak
            dist/quire-ai-engine-*.gz
          sbom-path: dist/Quire-${{ env.VERSION }}-sbom.spdx.json
      - name: Create draft release with all assets
        run: |
          packaging/release-notes.sh "$VERSION" > notes.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Quire $VERSION" --notes-file notes.md $prerelease dist/*
      - name: Publish (immutable from here on)
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

# Start a release from the Actions tab (handy from a phone):
# Actions → Tag release → Run workflow on main, and type the version.
#
# From a terminal, the same:
#   gh api repos/BhanuNexus/quire/actions/workflows/tag-release.yml/dispatches \
#     -f ref=main -f 'inputs[version]=X.Y.Z'
# Add -f 'inputs[check_only]=true' to run only the checks below and create nothing.
#
# The `tag-guard` job runs first and creates nothing. A tag can be used once
# (a failed release run cannot be repeated on the same version), so everything
# that can be known before the tag exists is checked here:
#   * the version matches Cargo.toml and has a CHANGELOG.md section;
#   * CI passed on the commit: the CI and CodeQL workflows succeeded on its push
#     and every check-run of those two runs finished with success or skipped
#     (packaging/check-ci-green.sh; other check-runs are information only);
#   * the Flatpak builder image is the digest recorded in
#     packaging/flatpak/builder-image.digest (the Release workflow stops on a
#     mismatch, dry run or not);
#   * the on-device models are pinned, when the Release workflow requires it.
# Only then does `tag` create the annotated tag `vX.Y.Z` on the commit that was
# checked (the main commit this run was started on) and start the Release workflow
# on it. (A tag created with the workflow token doesn't trigger other workflows
# by itself, so Release is started explicitly.)
#
# The tagger is the author of the tagged commit, so the tag is credited to the
# person who wrote the release commit rather than to whoever pressed the button.
#
# Pushing a tag yourself (`git tag -a vX.Y.Z && git push origin vX.Y.Z`) still
# works and does the same thing, without these checks.
name: Tag release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match Cargo.toml), e.g. 0.4.0"
        required: true
        type: string
      check_only:
        description: "Only run the checks (CI green, builder image, version): create no tag and start no release"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the commit; see whether the tag exists
      checks: read # the commit's check-runs
      actions: read # the commit's workflow runs
    steps:
      - name: Run on main only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Tag release must be run on main (this run is on $REF). Dispatch it with ref=main. Nothing was created."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::The version must look like 1.2.3"
            exit 1
          fi
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml says $cargo_version, not $VERSION"
            exit 1
          fi
          packaging/release-notes.sh "$VERSION" > /dev/null
      - name: The tag doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # Only "404 Not Found" means the tag is free; any other answer (a 5xx,
          # a rate limit, no permission) is an error, not a free tag.
          if out="$(gh api "repos/$REPO/git/ref/tags/v$VERSION" --silent 2>&1)"; then
            echo "::error::v$VERSION already exists (a tag is never reused: pick the next version)"
            exit 1
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "::error::Couldn't tell whether v$VERSION exists: $out"
            exit 1
          fi
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SHA"
          packaging/check-ci-green.sh "$REPO" "$SHA"
      - name: The Flatpak builder image is the recorded digest
        run: packaging/flatpak/check-builder-image.sh
      - name: On-device models are pinned (when the Release workflow requires it)
        run: |
          if grep -q '^  REQUIRE_MODEL_PINS: "true"' .github/workflows/release.yml; then
            python3 packaging/pin-models.py --check
          else
            echo "The Release workflow doesn't require pinned models (REQUIRE_MODEL_PINS)."
          fi

  tag:
    needs: tag-guard
    if: ${{ !inputs.check_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag
      actions: write # start the Release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          if out="$(gh api "repos/$REPO/git/ref/tags/$tag" --silent 2>&1)"; then
            echo "::error::$tag already exists"
            exit 1
          elif ! printf '%s' "$out" | grep -q 'HTTP 404'; then
            echo "::error::Couldn't tell whether $tag exists: $out"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          # The commit the guard checked is the commit that is tagged.
          if [ "$sha" != "$CHECKED_SHA" ]; then
            echo "::error::Checked out $sha, but the guard checked $CHECKED_SHA"
            exit 1
          fi
          name="$(git log -1 --format=%an "$sha")"
          email="$(git log -1 --format=%ae "$sha")"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          { echo "Quire $VERSION"; echo; packaging/release-notes.sh "$VERSION"; } > "$RUNNER_TEMP/message.txt"
          jq -n --arg tag "$tag" --arg sha "$sha" --arg name "$name" --arg email "$email" --arg date "$date" \
            --rawfile message "$RUNNER_TEMP/message.txt" \
            '{tag: $tag, message: $message, object: $sha, type: "commit", tagger: {name: $name, email: $email, date: $date}}' \
            > "$RUNNER_TEMP/tag.json"
          tag_sha="$(gh api "repos/$REPO/git/tags" --input "$RUNNER_TEMP/tag.json" --jq .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_sha" --silent
          echo "Tagged $sha as $tag (tagger: $name)" >> "$GITHUB_STEP_SUMMARY"
      - name: Start the Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run release.yml --repo "$REPO" --ref "v$VERSION"
          echo "Started the Release workflow on v$VERSION." >> "$GITHUB_STEP_SUMMARY"

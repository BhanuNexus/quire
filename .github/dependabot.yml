version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Security updates have their own limit (they are not held back by the
    # version-update limit), but a low cap here lets a few big rendering bumps
    # fill the queue; keep room for the rest.
    open-pull-requests-limit: 10
    groups:
      egui:
        patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor"]
      # Heavy rendering and model crates: one reviewed PR each family, so a
      # breaking change in one (pixel or text output, models) does not hold up
      # the small updates, and the small updates do not hide it.
      rendering:
        patterns: ["resvg", "usvg", "tiny-skia*", "hayro*", "skrifa", "read-fonts", "fontdb", "vello*", "typst*", "krilla*", "mermaid-rs-renderer", "mitex*"]
      ocr-models:
        patterns: ["rten*", "ocrs", "candle-*", "tokenizers"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["egui*", "eframe", "epaint*", "emath", "ecolor", "resvg", "usvg", "tiny-skia*", "hayro*", "skrifa", "read-fonts", "fontdb", "vello*", "typst*", "krilla*", "mermaid-rs-renderer", "mitex*", "rten*", "ocrs", "candle-*", "tokenizers"]
    # These follow the versions Typst pins (Typst 0.15: hayro 0.7, resvg and
    # usvg 0.47). A newer one next to Typst's copy puts two PDF/SVG stacks in
    # the full edition (+3 MiB, over its size budget). Lift this when a Typst
    # release moves to hayro 0.8 and resvg 0.49 or later, and bump them together.
    ignore:
      - dependency-name: "hayro"
      - dependency-name: "hayro-interpret"
      - dependency-name: "resvg"
      - dependency-name: "usvg"
    labels: ["dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]

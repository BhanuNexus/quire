[package]
name = "quire-vault"
description = "Storage port, local and in-memory adapters, notes, templates and refactors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# Accept the fast Argon2id settings of tests in key files. Only other crates'
# tests turn it on (as a dev-dependency feature); a build never has it.
weak-kdf = []

[dependencies]
quire-markdown.workspace = true
chrono.workspace = true
tempfile.workspace = true
notify.workspace = true
crossbeam-channel.workspace = true
thiserror.workspace = true
flate2 = "1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
sha2.workspace = true
# 0.11 locked folders: the crypto Quire Sync uses (docs/formats/locked-folders.md).
quire-sync.workspace = true
chacha20poly1305.workspace = true
argon2 = "0.6"
hkdf = "0.13"
hmac = "0.13"
getrandom.workspace = true
zeroize = { version = "1", features = ["derive"] }

[lints]
workspace = true

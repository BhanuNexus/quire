[package]
name = "quire-ai"
description = "On-device AI client: model catalog, downloader, engine process and IPC protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# The app side: catalog, engine process manager, and (with WS-D) the
# downloader and the LocalEmbedder/LocalChat/LocalOcr clients. Without it
# only `protocol` is built, which is all the engine sidecar links.
client = ["dep:toml"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml = { workspace = true, optional = true }

[lints]
workspace = true

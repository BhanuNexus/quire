[package]
name = "quire-base"
description = "Stateless, dependency-light helpers every Quire crate may use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = []
# The shared HTTP client builder (`net`). Off by default: only the crates
# that P6 allows to reach the network turn it on, so ureq stays out of
# every other crate's build (the sync server, the AI engine).
net = ["dep:ureq"]

[dependencies]
# Every one of these was already in the tree; none is a workspace crate.
tempfile.workspace = true
getrandom.workspace = true
sha2.workspace = true
chrono.workspace = true
ureq = { workspace = true, optional = true }

[lints]
workspace = true

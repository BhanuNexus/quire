[package]
name = "quire-pdf"
description = "PDF text with positions, page rendering and annotation notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["text"]
# Text extraction with positions (both editions). hayro-interpret joins with WS-G.
text = []
# Page rendering (the full edition only, through the desktop's `typeset` feature).
render = ["text"]

[dependencies]
quire-markdown.workspace = true
quire-vault.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

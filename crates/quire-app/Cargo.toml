[package]
name = "quire-app"
description = "UI-agnostic application layer for Quire: documents, workspace, commands, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["typeset"]
# Math, Mermaid diagrams and PDF export (Typst). About 40 MB of the full app;
# Quire Lite is built without it.
typeset = ["dep:quire-typeset", "quire-pdf/render"]
# Tests only: locked folders with fast Argon2id settings (quire-vault/weak-kdf).
weak-kdf = ["quire-vault/weak-kdf"]

[dependencies]
quire-base = { workspace = true, features = ["net"] }
quire-text.workspace = true
quire-markdown.workspace = true
quire-vault.workspace = true
quire-index.workspace = true
# The network providers (Anthropic, OpenAI-compatible). Nothing connects
# unless the person configures a provider.
quire-intel = { workspace = true, features = ["remote-llm"] }
quire-typeset = { workspace = true, optional = true }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
crossbeam-channel.workspace = true
regex.workspace = true
png.workspace = true
# API keys go in the OS keychain (a 0600 file where there is none).
keyring = "4"
# The daily check for a newer release on GitHub, off until the person turns it on.
ureq.workspace = true
flate2 = "1"
similar.workspace = true
# 0.12: "remote" adds S3-compatible storage and WebDAV.
quire-sync = { workspace = true, features = ["http", "remote"] }
base64 = "0.23"
quire-agent.workspace = true
# 0.9 workstreams add their crates on their own line below its marker, so
# parallel branches don't edit the same lines (docs/design/F0-notes.md).
# WS-D: quire-ai
quire-ai = { workspace = true, features = ["client"] }
# WS-E: quire-plan
quire-plan.workspace = true
notify-rust.workspace = true
quire-import.workspace = true
# WS-G: quire-canvas, quire-pdf (and "quire-pdf/render" in `typeset` above)
quire-canvas.workspace = true
quire-pdf.workspace = true
biblatex.workspace = true
tempfile.workspace = true
# 0.10 security: note HTML in the web app and published sites.
ammonia.workspace = true

[dev-dependencies]
quire-vault = { workspace = true, features = ["weak-kdf"] }
# 0.12: in-process S3 and WebDAV servers for the sync tests.
quire-sync = { workspace = true, features = ["mock-server"] }

[lints]
workspace = true

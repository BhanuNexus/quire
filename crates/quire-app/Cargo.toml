[package]
name = "quire-app"
description = "UI-agnostic application layer for Quire: documents, workspace, commands, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["remote-llm", "keychain", "update-check"]
# Network providers (Anthropic, OpenAI-compatible). Nothing connects unless configured.
remote-llm = ["quire-intel/remote-llm"]
# Store API keys in the OS keychain instead of a 0600 file.
keychain = ["dep:keyring"]
# Opt-in daily check for a newer release on GitHub (off until the user turns it on).
update-check = ["dep:ureq"]

[dependencies]
quire-text.workspace = true
quire-markdown.workspace = true
quire-vault.workspace = true
quire-index.workspace = true
quire-intel.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
crossbeam-channel.workspace = true
regex.workspace = true
png.workspace = true
keyring = { version = "4", optional = true }
ureq = { workspace = true, optional = true }
flate2 = "1"
similar.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

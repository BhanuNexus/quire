[package]
name = "quire-app"
description = "UI-agnostic application layer for Quire: documents, workspace, commands, settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = ["remote-llm", "keychain", "update-check", "typeset"]
# Network providers (Anthropic, OpenAI-compatible). Nothing connects unless configured.
remote-llm = ["quire-intel/remote-llm"]
# Store API keys in the OS keychain instead of a 0600 file.
keychain = ["dep:keyring"]
# Opt-in daily check for a newer release on GitHub (off until the user turns it on).
update-check = ["dep:ureq"]
# Math, Mermaid diagrams and PDF export (Typst). About 40 MB of the full app;
# Quire Lite is built without it.
typeset = ["dep:quire-typeset", "quire-pdf/render"]

[dependencies]
quire-text.workspace = true
quire-markdown.workspace = true
quire-vault.workspace = true
quire-index.workspace = true
quire-intel.workspace = true
quire-typeset = { workspace = true, optional = true }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
crossbeam-channel.workspace = true
regex.workspace = true
png.workspace = true
keyring = { version = "4", optional = true }
ureq = { workspace = true, optional = true }
flate2 = "1"
similar.workspace = true
quire-sync = { workspace = true, features = ["http"] }
base64 = "0.23"
quire-agent.workspace = true
# 0.9 workstreams add their crates on their own line below its marker, so
# parallel branches don't edit the same lines (docs/design/F0-notes.md).
# WS-D: quire-ai
quire-ai = { workspace = true, features = ["client"] }
# WS-E: quire-plan
quire-plan.workspace = true
notify-rust.workspace = true
quire-import.workspace = true
# WS-G: quire-canvas, quire-pdf (and "quire-pdf/render" in `typeset` above)
quire-canvas.workspace = true
quire-pdf.workspace = true
biblatex.workspace = true
tempfile.workspace = true

[dev-dependencies]

[lints]
workspace = true

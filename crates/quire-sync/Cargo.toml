[package]
name = "quire-sync"
description = "End-to-end encrypted sync engine for Quire vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = []
# A Transport that talks to quire-sync-server over HTTPS.
http = ["dep:ureq"]
# 0.12: transports for S3-compatible storage and WebDAV (docs/design/0.12-sync.md).
remote = ["http", "dep:roxmltree", "dep:chrono", "dep:base64"]
# An in-process S3 and WebDAV server for tests of this crate and its users.
mock-server = ["remote"]

[dependencies]
quire-text.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chacha20poly1305.workspace = true
argon2 = "0.6"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.4"
zeroize = { version = "1", features = ["derive"] }
# 0.13: device keys, so removing a device can hand the vault's new key to
# the other devices only (docs/design/0.13-sync.md). The dalek crates are
# the maintained, audited pure-Rust X25519.
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
ureq = { workspace = true, optional = true }
# Listings from S3 (ListObjectsV2) and WebDAV (PROPFIND). Already in the tree
# through usvg; rejects DTDs by default, so no entity expansion.
roxmltree = { version = "0.21", optional = true }
# SigV4 dates and the clock-skew check.
chrono = { workspace = true, optional = true }
# WebDAV Basic authentication.
base64 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# The remote transports and their in-process test servers, for this
# crate's own tests (tests/remote.rs).
quire-sync = { path = ".", features = ["mock-server"] }

[lints]
workspace = true

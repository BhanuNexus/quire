[package]
name = "quire-web"
description = "The web app of `quire-cli serve`: read and edit a vault in a browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = []
# Math and Mermaid diagrams as SVG (the full edition); without it they show as source.
typeset = ["quire-app/typeset", "dep:quire-typeset"]

[dependencies]
quire-app.workspace = true
quire-agent.workspace = true
quire-mcp.workspace = true
quire-typeset = { workspace = true, optional = true }
axum.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
getrandom.workspace = true
base64.workspace = true
chrono.workspace = true
similar.workspace = true
unicode-normalization.workspace = true
# The web passphrase's hash (already in the tree through quire-sync).
argon2 = "0.6"

[dev-dependencies]
tempfile.workspace = true
ureq.workspace = true

[lints]
workspace = true

[package]
name = "quire-intel"
description = "Local-first intelligence for Quire: related notes, link and tag suggestions, summaries, calculator, natural dates, optional LLM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = []
# Adds an Anthropic Messages API provider. Off by default: no network code ships unless asked for.
remote-llm = ["dep:ureq", "dep:serde_json"]

[dependencies]
quire-markdown.workspace = true
quire-vault.workspace = true
quire-index.workspace = true
chrono.workspace = true
unicode-segmentation.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
ureq = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true

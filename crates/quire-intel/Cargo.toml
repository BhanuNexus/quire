[package]
name = "quire-intel"
description = "Local-first intelligence for Quire: related notes, link and tag suggestions, summaries, calculator, natural dates, optional LLM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
default = []
# The network providers: the Anthropic Messages API, OpenAI-compatible servers
# and embedding endpoints. Off by default, so a crate that needs only the
# on-device parts (quire-agent) builds without network code. quire-app and
# quire-assistant turn it on, so both editions of both apps ship it; nothing
# connects until the person configures a provider.
remote-llm = ["dep:ureq", "quire-base/net"]

[dependencies]
quire-base.workspace = true
quire-markdown.workspace = true
quire-vault.workspace = true
quire-index.workspace = true
unicode-segmentation.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
ureq = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
# WS-C: fuzzy re-anchoring of citations and line mapping (anchor.rs).
strsim.workspace = true
similar.workspace = true

[lints]
workspace = true

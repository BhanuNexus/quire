[package]
name = "quire-import"
description = "Import notes from Logseq, Bear, Notion, Evernote and Markdown folders into a Quire vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
quire-vault.workspace = true
quire-markdown.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
htmd = "0.5"
base64 = "0.23"
md5 = "0.8"
# URL capture (`web`, WS-B): fetch, Readability extraction, charset decoding.
ureq.workspace = true
dom_smoothie.workspace = true
encoding_rs.workspace = true
sha2.workspace = true
# Captured images are decoded before they are kept (PNG, JPEG, GIF, WebP).
image.workspace = true
# WS-E: Obsidian Bases (.base YAML)
yaml-rust2.workspace = true
# 0.10: dates in Bases formulas
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

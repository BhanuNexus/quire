[package]
name = "quire-cli"
description = "Headless Quire: index, search, backlinks, related, tasks, export, bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "quire-cli"
path = "src/main.rs"

[features]
default = ["typeset"]
# `quire-cli pdf`. Quire Lite is built without it.
typeset = ["quire-app/typeset", "quire-web/typeset"]
# `quire-cli eval` (design §B.6): development only, never in releases.
eval = []

[dependencies]
quire-app = { workspace = true, features = ["remote-llm", "keychain", "update-check"] }
quire-import = { path = "../../crates/quire-import" }
quire-agent.workspace = true
quire-mcp.workspace = true
# 0.9 workstreams add their crates on their own line below its marker.
# WS-D: quire-ai, quire-assistant
quire-ai = { workspace = true, features = ["client"] }
quire-assistant.workspace = true
# WS-E: quire-plan
chrono.workspace = true
serde_json.workspace = true
# 0.10 serve: the web app, and a clean stop on SIGINT/SIGTERM.
quire-web.workspace = true
tokio = { workspace = true, features = ["rt", "signal", "macros"] }

[dev-dependencies]
tempfile.workspace = true
# 0.10 integration: `sync` and `serve --sync` against a real Quire Sync
# server, in the test process.
quire-sync-server = { path = "../quire-sync-server" }
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
ureq.workspace = true

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

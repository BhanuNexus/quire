[package]
name = "quire-sync-server"
description = "Self-hostable, end-to-end encrypted sync server for Quire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "quire-sync-server"
path = "src/main.rs"

[dependencies]
quire-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
rusqlite = { version = "0.41", features = ["bundled"] }
subtle = "2"
sha2 = "0.11"
thiserror.workspace = true

[dev-dependencies]
quire-sync = { workspace = true, features = ["http"] }
tempfile.workspace = true

[lints]
workspace = true

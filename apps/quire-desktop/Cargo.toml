[package]
name = "quire-desktop"
description = "Quire desktop app (egui frontend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "quire"
path = "src/main.rs"

[features]
default = ["typeset"]
remote-llm = ["quire-app/remote-llm"]
# Math, diagrams and PDF export. `--no-default-features` builds Quire Lite.
typeset = ["quire-app/typeset", "dep:quire-typeset", "dep:resvg", "quire-pdf/render"]

[dependencies]
quire-app = { workspace = true, features = ["remote-llm", "keychain", "update-check"] }
quire-import.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
global-hotkey.workspace = true
resvg = { workspace = true, optional = true }
quire-spell.workspace = true
quire-typeset = { workspace = true, optional = true }
# The monochrome emoji font: icons, task dates (📅 ⏳) and ▸ ▾ in every edition.
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_commonmark.workspace = true
rfd.workspace = true
chrono.workspace = true
directories.workspace = true
egui_extras.workspace = true
image.workspace = true
# 0.9 workstreams add their crates on their own line below its marker, so
# parallel branches don't edit the same lines (docs/design/F0-notes.md).
# WS-B: quire-mcp (with features = ["http"] for the HTTP server)
quire-mcp.workspace = true
# WS-D: quire-ai, quire-assistant
quire-ai = { workspace = true, features = ["client"] }
quire-assistant.workspace = true
# WS-G: quire-canvas, quire-pdf (and "quire-pdf/render" in `typeset` above)
quire-canvas.workspace = true
quire-pdf.workspace = true
# 0.10 people: Excalidraw pictures drawn with egui's own 2D renderer and font reader
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
base64 = "0.23"

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true

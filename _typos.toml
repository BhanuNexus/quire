# typos configuration. Run: typos
[files]
extend-exclude = [
  # Hunspell affix rules and word lists: stems and fragments, not prose.
  "crates/quire-spell/dictionaries/",
  # Spell-checker tests are full of deliberate misspellings.
  "crates/quire-spell/tests/",
  # Vim test cases: key sequences and words cut by the cursor marker.
  "crates/quire-text/testdata/vim/",
  # Fuzzer corpus and crash inputs: arbitrary bytes.
  "fuzz/corpus/",
  "fuzz/artifacts/",
]

[default.extend-words]
# Dirac bra-ket notation: LaTeX's \ket and \braket in crates/quire-typeset.
ket = "ket"
braket = "braket"
# Candle's `Tensor::arange` (apps/quire-ai-engine).
arange = "arange"
# The `flate2` crate (deflate), named in the 0.14 design notes.
flate = "flate"

[type.rust]
# Whisper's language codes (`"fo"`, `"ba"`…) in apps/quire-ai-engine/src/whisper.rs.
extend-ignore-re = ['"(fo|ba)",']
